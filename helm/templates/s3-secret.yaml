{{- if and .Values.enabled (not .Values.s3.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "developer-portal.s3SecretName" . }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.s3.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.s3.secretAccessKey | quote }}
{{- end }}
