global:
  cloudProvider: {}
  environment: {}
enabled: true
environment: development
replicaCount: 1
initialDelaySeconds: 60
nodePort: 30030
resetOnConfigChange: true
cloudProvider:
  imagePullSecretName: mapcolonies-pull-secret
  flavor: openshift

image:
  repository: localhost/mapcolonies/common/maps-playground
  tag: 0.0.1-4
  imagePullPolicy: IfNotPresent

mclabels:
  environment: production
  owner: common
  partOf: maps-playground
  component: frontend
  prometheus:
    enabled: true
    port: 8080
    path: /metrics
  logScraping: false

metrics:
  grafanaDashboard:
    enabled: true
    label: grafana_dashboard
    value: "1"

s3:
  url: 'http://localhost:9000'
  bucket: 'temp'
  region: 'us-east-1'
  # Provide credentials via an existing Secret (must expose AWS_ACCESS_KEY_ID and
  # AWS_SECRET_ACCESS_KEY). Leave empty to have the chart create the Secret from the
  # accessKeyId/secretAccessKey values below.
  existingSecret: ''
  accessKeyId: 'user'
  secretAccessKey: 'password'

items:
  indexKey: 'index.json'
  timeout: 600
  stale: 600

# Public navigation links exposed to the browser.
links:
  catalogHref: 'http://catalog'
  devPortalHref: 'http://developer-portal'
  puzzleHref: ''

env:
  port: 8080
  targetPort: 8080

cache:
  debounceMs: 500

# Agent chat panel (LiteLLM-backed). Dark unless enabled=true.
agent:
  enabled: false
  model: inclusionai/ling-3.0-flash:free
  developerPortalUrl: 'http://developer-portal'
  # Optional: expected browser Origin for /api/agent behind a proxy. Empty = app origin.
  allowedOrigin: ''
  litellm:
    baseUrl: 'http://litellm:4000'
    # Provide the key via an existing Secret (must expose LITELLM_API_KEY). Leave empty
    # to have the chart create the Secret from apiKey below.
    existingSecret: ''
    apiKey: ''

resources:
  enabled: true
  value:
    limits:
      cpu: 200m
      memory: 150Mi
    requests:
      cpu: 50m
      memory: 150Mi

route:
  enabled: true
  https: true
  path: /
  host: playground
  port:
    targetPort: http
  tls:
    termination: edge
    certificate: ''
    key: ''
    caCertificate: ''
    insecureEdgeTerminationPolicy: Redirect # <- important
  timeout:
    enabled: false
    duration: 60s

ingress:
  enabled: false
  path: /
  host: localhost
  cors:
    enabled: true
    origin: '*'
